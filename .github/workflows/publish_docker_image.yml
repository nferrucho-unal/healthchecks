name: Publish Docker image

on:
    push:
        branches: [master]
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Tests hc.${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [api, front, accounts, lib, logs]
        env:
            SECRET_KEY: dummy-key
            DB: postgres
            DB_HOST: localhost
            DB_NAME: hc
            DB_USER: postgres
            DB_PASSWORD: postgres
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: hc
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
            - name: Run tests for hc.${{ matrix.service }}
              run: python manage.py test hc.${{ matrix.service }} --verbosity 2

    typecheck:
        name: Mypy
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
                  touch hc/local_settings.py
            - name: Run mypy
              run: mypy --strict hc

    lint:
        name: Lint Dockerfile y manifiestos
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Hadolint (Dockerfile)
              uses: hadolint/hadolint-action@v3.5.0
              with:
                  dockerfile: docker/Dockerfile
                  failure-threshold: error
            - name: Validate docker-compose manifests
              run: |
                  cp docker/.env.example docker/.env
                  docker compose -f docker-compose.yml config -q
                  docker compose -f docker/docker-compose.yml config -q
            - name: Actionlint (GitHub workflows)
              uses: raven-actions/actionlint@v2

    image:
        name: Build, scan and publish image to GHCR
        runs-on: ubuntu-latest
        needs: [lint, tests, typecheck]
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.digest.outputs.digest }}
        env:
            REGISTRY: ghcr.io
        steps:
            - uses: actions/checkout@v7
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=ref,event=pr
                      type=sha,prefix=sha-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build multi-platform OCI image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
                  outputs: type=oci,dest=/tmp/healthchecks.tar
                  tags: healthchecks:ci
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false
                  sbom: false

            - name: Set up Trivy
              uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
              with:
                  version: v0.75.0
                  cache: false

            - name: Scan every platform for vulnerabilities
              shell: bash
              run: |
                  set +e
                  mkdir -p trivy-reports
                  mkdir -p /tmp/healthchecks-oci
                  tar -xf /tmp/healthchecks.tar -C /tmp/healthchecks-oci
                  scan_failed=0
                  for platform in linux/amd64 linux/arm/v7 linux/arm64/v8; do
                      platform_file="${platform//\//-}"
                      report="trivy-reports/${platform_file}.json"
                      sbom="trivy-reports/${platform_file}.cdx.json"
                      log="trivy-reports/${platform_file}.log"
                      trivy image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
                          --input /tmp/healthchecks-oci --platform "$platform" \
                          --scanners vuln --format json --output "$report" 2>&1 | tee "$log"
                      report_status=${PIPESTATUS[0]}
                      trivy image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
                          --input /tmp/healthchecks-oci --platform "$platform" \
                          --scanners vuln --format cyclonedx --output "$sbom" 2>&1 | tee -a "$log"
                      sbom_status=${PIPESTATUS[0]}
                      trivy image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
                          --input /tmp/healthchecks-oci --platform "$platform" \
                          --scanners vuln --severity HIGH,CRITICAL --exit-code 1 2>&1 | tee -a "$log"
                      gate_status=${PIPESTATUS[0]}
                      if [ "$report_status" -ne 0 ] || [ "$sbom_status" -ne 0 ] || [ "$gate_status" -ne 0 ]; then
                          echo "Trivy scan failed for $platform (report=$report_status, sbom=$sbom_status, gate=$gate_status)"
                          scan_failed=1
                      fi
                  done
                  exit "$scan_failed"

            - name: Upload Trivy reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-vulnerability-reports
                  path: trivy-reports/
                  if-no-files-found: warn

            - name: Install Skopeo
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends skopeo

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push scanned OCI image to GHCR
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  while IFS= read -r image; do
                      [ -n "$image" ] || continue
                      skopeo copy --all --preserve-digests \
                          oci-archive:/tmp/healthchecks.tar "docker://${image}"
                  done <<< "$TAGS"

            - name: Get published image digest
              id: digest
              run: |
                  source="${REGISTRY}/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA:0:7}"
                  digest="$(skopeo inspect --raw "docker://${source}" | sha256sum | cut -d ' ' -f 1)"
                  echo "digest=sha256:${digest}" >> "$GITHUB_OUTPUT"

    push_to_registry:
        name: Promote scanned image to Docker Hub
        runs-on: ubuntu-latest
        needs: [lint, tests, typecheck, image]
        permissions:
            contents: read
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/healthchecks
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix=sha-

            - name: Install Skopeo
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends skopeo

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Promote scanned image to Docker Hub
              env:
                  SOURCE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  while IFS= read -r image; do
                      [ -n "$image" ] || continue
                      skopeo copy --all --preserve-digests \
                          "docker://${SOURCE}" "docker://${image}"
                  done <<< "$TAGS"
