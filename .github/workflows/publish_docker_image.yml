name: Publish Docker image

on:
    push:
        branches: [nelson]
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Run project test suite
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
            DB: postgres
            DB_HOST: localhost
            DB_NAME: hc
            DB_USER: postgres
            DB_PASSWORD: postgres
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: hc
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
            # Modificado: Ejecuta toda la suite consolidada de una sola vez
            - name: Run all tests
              run: python manage.py test --verbosity 2

    typecheck:
        name: Mypy
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
                  touch hc/local_settings.py
            - name: Run mypy
              run: mypy --strict hc

    lint:
        name: Lint Dockerfile y manifiestos
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Hadolint (Dockerfile)
              uses: hadolint/hadolint-action@v3.5.0
              with:
                  dockerfile: docker/Dockerfile
                  failure-threshold: error
            - name: Validate docker-compose manifests
              run: |
                  cp docker/.env.example docker/.env
                  docker compose -f docker-compose.yml config -q
                  docker compose -f docker/docker-compose.yml config -q
            - name: Actionlint (GitHub workflows)
              uses: raven-actions/actionlint@v2

    image:
        name: Build and publish image to GHCR
        runs-on: ubuntu-latest
        needs: [lint, tests, typecheck]
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v3

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=raw,value=latest,enable=${{ github.ref_name == 'nelson' }} # Forzar latest en rama nelson

            - name: Build image (local)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  load: true
                  push: false
                  tags: healthchecks:ci
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false
                  sbom: false

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push image to GHCR
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha

    push_to_registry:
        name: Push Docker image to Docker Hub
        runs-on: ubuntu-latest
        needs: [lint, tests, typecheck, image]
        permissions:
            contents: read
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/healthchecks
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix=sha-
                      type=raw,value=latest,enable=${{ github.ref_name == 'nelson' }} # Forzar latest en rama nelson

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # --- INTEGRACIÓN DE TRIVY (PASO 1: Compilación de prueba local) ---
            - name: Build image locally for scanning
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/Dockerfile
                  load: true
                  push: false
                  tags: healthchecks:scan-target

            # --- INTEGRACIÓN DE TRIVY (PASO 2: Escaneo de Seguridad) ---
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: 'healthchecks:scan-target'
                  format: 'table'
                  exit-code: '1'
                  ignore-unfixed: true
                  severity: 'CRITICAL,HIGH'

            # --- INTEGRACIÓN DE TRIVY (PASO 3: Compilación multi-arch y Push definitivo) ---
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  sbom: true
