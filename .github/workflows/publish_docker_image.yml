#V11- unifamos despliegues
name: Publish Docker image

on:
    push:
        branches: [master]
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Run project test suite
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
            DB: postgres
            DB_HOST: localhost
            DB_NAME: hc
            DB_USER: postgres
            DB_PASSWORD: postgres
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: hc
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
            - name: Run all tests
              run: python manage.py test --verbosity 2

    typecheck:
        name: Mypy
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
                  touch hc/local_settings.py
            - name: Run mypy
              run: mypy hc

    lint:
        name: Lint Dockerfile y manifiestos
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Hadolint (Dockerfile)
              uses: hadolint/hadolint-action@v3.5.0
              with:
                  dockerfile: docker/Dockerfile
                  failure-threshold: error
            - name: Validate docker-compose manifests
              run: |
                  cp docker/.env.example docker/.env
                  docker compose -f docker/docker-compose.yml config -q
            - name: Actionlint (GitHub workflows)
              uses: raven-actions/actionlint@v2

    publish_images:
        name: Build, Scan and Publish Image (GHCR & Docker Hub)
        runs-on: ubuntu-latest
        needs: [lint, tests, typecheck]
        permissions:
            contents: read
            packages: write  # Requerido para poder subir a GHCR
        env:
            REGISTRY_GHCR: ghcr.io
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            # 1. Extraer metadatos unificados para ambos registros
            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      ${{ env.REGISTRY_GHCR }}/${{ github.repository }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/healthchecks
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=ref,event=tag
                      type=sha,prefix=sha-
                      type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

            # 2. Configurar emuladores para compilación Multi-Arch (QEMU y Buildx)
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 3. Compilación local rápida (Single-Arch) EXCLUSIVA para el escaneo de seguridad
            - name: Build image locally for scanning
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  load: true
                  push: false
                  tags: healthchecks:scan-target
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # 4. Escaneo de Seguridad con Trivy (Falla si hay vulnerabilidades CRITICAL o HIGH)
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.35.0
              with:
                  image-ref: 'healthchecks:scan-target'
                  format: 'table'
                  exit-code: '1'
                  ignore-unfixed: true
                  severity: 'CRITICAL,HIGH'
                  vuln-type: 'os,library'

            # 5. Autenticación en GitHub Container Registry
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY_GHCR }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 6. Autenticación en Docker Hub
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 7. Compilación Multi-Arch final y Push simultáneo a ambos registros
            - name: Build and push Docker image to GHCR & Docker Hub
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  
    # 8. Despliegue local con Terraform (después de publicar y escanear la imagen)
    deploy_local:
        name: Desplegar en localhost:8000
        needs: [publish_images]
        if: github.ref == 'refs/heads/master' || github.event_name == 'release'
        uses: ./.github/workflows/deploy_local_terraform.yml
        permissions:
            contents: read