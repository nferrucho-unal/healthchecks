name: CI por servicio

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests hc.${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [api, front, accounts, lib, logs]
        env:
            SECRET_KEY: dummy-key
            DB: postgres
            DB_HOST: localhost
            DB_NAME: hc
            DB_USER: postgres
            DB_PASSWORD: postgres
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: hc
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
            - name: Run tests for hc.${{ matrix.service }}
              run: python manage.py test hc.${{ matrix.service }} --verbosity 2

    typecheck:
        name: Mypy
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
                  touch hc/local_settings.py
            - name: Run mypy
              run: mypy --strict hc

    compose-validate:
        name: Validar docker-compose
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Validate compose file
              run: |
                  cp docker/.env.example docker/.env
                  docker compose config -q

    docker-build:
        name: Build imagen Docker
        runs-on: ubuntu-latest
        needs: tests
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
