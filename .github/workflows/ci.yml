name: CI por servicio

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests hc.${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [api, front, accounts, lib, logs]
        env:
            SECRET_KEY: dummy-key
            DB: postgres
            DB_HOST: localhost
            DB_NAME: hc
            DB_USER: postgres
            DB_PASSWORD: postgres
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: hc
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
            - name: Run tests for hc.${{ matrix.service }}
              run: python manage.py test hc.${{ matrix.service }} --verbosity 2

    typecheck:
        name: Mypy
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: dummy-key
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install system dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libcurl4-openssl-dev libpython3-dev libssl-dev
            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -r requirements-dev.txt
                  touch hc/local_settings.py
            - name: Run mypy
              run: mypy --strict hc

    lint:
        name: Lint Dockerfile y manifiestos
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Hadolint (Dockerfile)
              uses: hadolint/hadolint-action@v3.5.0
              with:
                  dockerfile: docker/Dockerfile
                  failure-threshold: error
            - name: Validate docker-compose manifests
              run: |
                  cp docker/.env.example docker/.env
                  docker compose -f docker-compose.yml config -q
                  docker compose -f docker/docker-compose.yml config -q
            - name: Actionlint (GitHub workflows)
              uses: raven-actions/actionlint@v2

    image:
        name: Build, escaneo y publicación de la imagen
        runs-on: ubuntu-latest
        needs: [lint, tests]
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v3

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build image (local)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  load: true
                  push: false
                  tags: healthchecks:ci
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  # Provenance/SBOM attestations attach a third-party SBOM to the
                  # loaded image that Trivy prefers over scanning the real
                  # filesystem, which can report stale/incorrect package
                  # versions. Disable them for the locally-scanned build.
                  provenance: false
                  sbom: false

            # Deshabilitado temporalmente mientras evaluamos cómo filtrar los
            # falsos positivos que reporta Trivy sobre las copias vendorizadas
            # dentro de pip (pip/_vendor/vendor.txt declara versiones antiguas
            # de msgpack/urllib3/setuptools que no son dependencias reales de
            # la aplicación y no podemos actualizar directamente).
            # - name: Trivy vulnerability scan
            #   uses: aquasecurity/trivy-action@0.35.0
            #   with:
            #       image-ref: healthchecks:ci
            #       format: table
            #       severity: CRITICAL,HIGH
            #       ignore-unfixed: true
            #       exit-code: "1"

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push image to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
